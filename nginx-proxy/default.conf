# Nginx Reverse Proxy Container (ด่านหน้าของระบบ)
# รับการเชื่อมต่อจากภายนอกพอร์ต 80/443 จัดการ SSL/TLS (ใบรับรอง Let's Encrypt จาก Certbot)
# แล้วส่งต่อทุกคำขอไปยัง Frontend Container ผ่านเครือข่ายภายในของ Docker

# 1. HTTP (พอร์ต 80): ใช้ตอบ ACME Challenge ของ Certbot และเปลี่ยนเส้นทางไป HTTPS
server {
    listen 80;
    server_name tumkrokzing.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (พอร์ต 443): ถอดรหัส SSL แล้วส่งต่อไปยัง Frontend Container
server {
    listen 443 ssl;
    http2 on;
    server_name tumkrokzing.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tumkrokzing.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumkrokzing.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # รองรับการอัปโหลดรูปภาพเมนูและรูปหลักฐานการจัดส่ง
    client_max_body_size 20m;

    # ส่งต่อ WebSocket (Socket.IO) ให้คงการเชื่อมต่อแบบเรียลไทม์ได้นาน
    location /socket.io {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
