services:
  # 1. บริการส่วนของฐานข้อมูล MySQL
  mysql-db:
    image: mysql:8.0
    container_name: tumkrokzing_db
    hostname: mysql-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tum_krok_zing
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. บริการส่วนของ Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: tumkrokzing_backend
    restart: always
    ports:
      - "5000:5000"
      - "3000:5000"
    environment:
      DATABASE_URL: "mysql://root:rootpassword@mysql-db:3306/tum_krok_zing"
      PORT: 5000
    depends_on:
      - mysql-db
