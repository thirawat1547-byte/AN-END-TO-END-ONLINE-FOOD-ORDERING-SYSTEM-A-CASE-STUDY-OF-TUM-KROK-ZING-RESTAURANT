services:
  # 1. บริการส่วนของฐานข้อมูล MySQL
  mysql-db:
    image: mysql:8.0
    container_name: tumkrokzing_db
    hostname: mysql-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tum_krok_zing
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. บริการส่วนของ Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: tumkrokzing_backend
    restart: always
    ports:
      - "5000:5000"
      - "3000:5000"
    environment:
      DATABASE_URL: "mysql://root:rootpassword@mysql-db:3306/tum_krok_zing"
      PORT: 5000
      FRONTEND_URL: "https://tumkrokzing.duckdns.org"
      # --- Google OAuth ---
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_CALLBACK_URL: "https://tumkrokzing.duckdns.org/api/v1/auth/google/callback"
      # --- Facebook OAuth ---
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET}"
      FACEBOOK_CALLBACK_URL: "https://tumkrokzing.duckdns.org/api/v1/auth/facebook/callback"
      # --- LINE OAuth ---
      LINE_CHANNEL_ID: "${LINE_CHANNEL_ID}"
      LINE_CHANNEL_SECRET: "${LINE_CHANNEL_SECRET}"
      LINE_CALLBACK_URL: "https://tumkrokzing.duckdns.org/api/v1/auth/line/callback"
    depends_on:
      - mysql-db
    volumes:
      - uploads_data:/app/uploads

  # 3. บริการส่วนของ Frontend (Vue.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tumkrokzing_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

# ประกาศสร้าง Volume สำหรับเก็บข้อมูล MySQL และรูปภาพที่อัปโหลดแบบถาวร
volumes:
  mysql_data:
  uploads_data:
