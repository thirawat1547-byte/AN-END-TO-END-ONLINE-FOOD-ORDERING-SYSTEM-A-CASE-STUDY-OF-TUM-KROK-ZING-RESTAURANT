services:
  # 1. บริการส่วนของฐานข้อมูล MySQL (ใช้ค่าเดิมของคุณทั้งหมด)
  mysql-db:
    image: mysql:8.0
    container_name: tumkrokzing_db
    hostname: mysql-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tum_krok_zing
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. บริการส่วนของ Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile # อิงตามชื่อไฟล์ของคุณที่ใช้ d พิมพ์เล็ก
    container_name: tumkrokzing_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # จุดสำคัญ: ให้ Backend วิ่งไปหาฐานข้อมูลผ่านชื่อ service 'mysql-db' (ใช้พอร์ตภายในคือ 3306)
      DATABASE_URL: "mysql://root:rootpassword@mysql-db:3306/tum_krok_zing"
      PORT: 3000
    depends_on:
      - mysql-db

  # 3. บริการส่วนของ Frontend (Vue.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile # อิงตามชื่อไฟล์ของคุณที่ใช้ d พิมพ์เล็ก
    container_name: tumkrokzing_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

# ประกาศสร้าง Volume สำหรับเก็บข้อมูล MySQL แบบถาวร (ของเดิม)
volumes:
  mysql_data:
