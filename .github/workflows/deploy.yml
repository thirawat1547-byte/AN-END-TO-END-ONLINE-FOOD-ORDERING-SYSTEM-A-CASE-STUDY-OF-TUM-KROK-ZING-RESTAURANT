name: Auto Deploy Tum Krok Zing

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH into OCI Server and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/AN-END-TO-END-ONLINE-FOOD-ORDERING-SYSTEM-A-CASE-STUDY-OF-TUM-KROK-ZING-RESTAURANT
          
          # ดึงโค้ดล่าสุดให้ตรงกับ GitHub 100%
          git fetch origin main
          git reset --hard origin/main
          
          # ตรวจสอบว่ามีไฟล์ .env อยู่ (สำคัญมากสำหรับ OAuth)
          if [ ! -f .env ]; then
            echo "⚠️ WARNING: .env file not found! OAuth will NOT work!"
            echo "Please create .env file with GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, etc."
          else
            echo "✅ .env file found"
            # แสดงชื่อตัวแปรที่มี (ไม่แสดงค่าเพื่อความปลอดภัย)
            echo "Environment variables defined:"
            grep -oP '^[A-Z_]+(?==)' .env || true
          fi
          
          # รัน Docker โดยอ่านค่าจากไฟล์ .env อัตโนมัติ (docker-compose อ่าน .env เองในโฟลเดอร์เดียวกัน)
          sudo docker-compose up -d --build

          # รอให้ Database และ Backend พร้อมทำงาน
          sleep 8

          # ซิงค์โครงสร้างตารางฐานข้อมูลและใส่ข้อมูลสูตรอาหารลงในเซิร์ฟเวอร์จริง
          sudo docker-compose exec -T backend npx prisma db push --accept-data-loss
          sudo docker-compose exec -T backend npx prisma db seed

          # รีสตาร์ท Backend เพื่อโหลดสูตรและคลังวัตถุดิบใหม่เข้าสู่ระบบ (พร้อม fallback ถ้าคอนเทนเนอร์หยุดทำงาน)
          sudo docker-compose restart backend || sudo docker-compose up -d backend
          sudo docker-compose up -d

          # แสดง Log ล่าสุดของ Backend เพื่อตรวจสอบ OAuth Initialization
          echo "=== Backend Startup Logs (last 20 lines) ==="
          sleep 3
          sudo docker logs tumkrokzing_backend --tail 20
