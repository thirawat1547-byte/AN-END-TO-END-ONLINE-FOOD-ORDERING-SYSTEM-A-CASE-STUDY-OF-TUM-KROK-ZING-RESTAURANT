name: Auto Deploy Tum Krok Zing

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH into OCI Server and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/AN-END-TO-END-ONLINE-FOOD-ORDERING-SYSTEM-A-CASE-STUDY-OF-TUM-KROK-ZING-RESTAURANT
          
          # ยกเลิกการใช้ git pull และบังคับให้เซิร์ฟเวอร์ก๊อปปี้โค้ดให้ตรงกับ GitHub แบบเป๊ะๆ 100%
          git fetch origin main
          git reset --hard origin/main
          
          # เปลี่ยนมาใช้ docker-compose (มีขีดกลาง)
          sudo docker-compose up -d --build
