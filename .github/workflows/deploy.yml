name: Auto Deploy Tum Krok Zing

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH into OCI Server and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # ค่าเริ่มต้น 10 นาทีไม่พอ (build backend + frontend บนเซิร์ฟเวอร์ใช้ ~5-8 นาที)
        command_timeout: 20m
        script: |
          cd ~/AN-END-TO-END-ONLINE-FOOD-ORDERING-SYSTEM-A-CASE-STUDY-OF-TUM-KROK-ZING-RESTAURANT
          
          # ดึงโค้ดล่าสุดให้ตรงกับ GitHub 100%
          git fetch origin main
          git reset --hard origin/main
          
          # ตรวจสอบว่ามีไฟล์ .env อยู่ (สำคัญมากสำหรับ OAuth)
          if [ ! -f .env ]; then
            echo "⚠️ WARNING: .env file not found! OAuth will NOT work!"
            echo "Please create .env file with GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, etc."
          else
            echo "✅ .env file found"
            # แสดงชื่อตัวแปรที่มี (ไม่แสดงค่าเพื่อความปลอดภัย)
            echo "Environment variables defined:"
            grep -oP '^[A-Z_]+(?==)' .env || true
          fi
          
          # ย้าย Reverse Proxy เข้าคอนเทนเนอร์ nginx-proxy: ปิด Nginx ที่ติดตั้งบนเครื่องเพื่อคืนพอร์ต 80/443
          # (ทำเฉพาะเมื่อมีใบรับรองแล้ว ถ้ายังไม่มีจะปล่อย Nginx เดิมให้บริการต่อเพื่อไม่ให้เว็บล่ม)
          sudo mkdir -p /var/www/certbot
          if sudo test -f /etc/letsencrypt/live/tumkrokzing.duckdns.org/fullchain.pem; then
            if systemctl is-active --quiet nginx; then
              echo "Stopping host Nginx (moved to nginx-proxy container)"
              sudo systemctl stop nginx
              sudo systemctl disable nginx
            fi
          else
            echo "⚠️ WARNING: SSL certificate not found, host Nginx is kept running"
          fi

          # รัน Docker โดยอ่านค่าจากไฟล์ .env อัตโนมัติ (docker-compose อ่าน .env เองในโฟลเดอร์เดียวกัน)
          sudo docker-compose up -d --build

          # รอให้ Database และ Backend พร้อมทำงาน
          sleep 8

          # ซิงค์โครงสร้างตารางฐานข้อมูลและใส่ข้อมูลสูตรอาหารลงในเซิร์ฟเวอร์จริง
          # (ไม่ใช้ --accept-data-loss: ถ้าการเปลี่ยน schema จะลบคอลัมน์/ตารางที่มีข้อมูล คำสั่งจะหยุดแทนการลบข้อมูลจริง)
          sudo docker-compose exec -T backend npx prisma db push || echo "⚠️ WARNING: prisma db push stopped (possible data loss) — schema not applied"
          sudo docker-compose exec -T backend npx prisma db seed

          # สร้าง Database Views 5 วิวจาก database/views.sql เฉพาะเมื่อยังไม่ครบ (ไม่เขียนทับ View ที่ใช้งานอยู่)
          VIEW_COUNT=$(sudo docker-compose exec -T mysql-db mysql -uroot -prootpassword -N -e "SELECT COUNT(*) FROM information_schema.VIEWS WHERE TABLE_SCHEMA='tum_krok_zing'" 2>/dev/null | tr -d '[:space:]')
          if [ -n "$VIEW_COUNT" ] && [ "$VIEW_COUNT" -lt 5 ]; then
            echo "Creating Database Views (found $VIEW_COUNT of 5)"
            sudo docker-compose exec -T mysql-db mysql -uroot -prootpassword tum_krok_zing < database/views.sql
          else
            echo "✅ Database Views: $VIEW_COUNT of 5"
          fi

          # รีสตาร์ท Backend เพื่อโหลดสูตรและคลังวัตถุดิบใหม่เข้าสู่ระบบ (พร้อม fallback ถ้าคอนเทนเนอร์หยุดทำงาน)
          sudo docker-compose restart backend || sudo docker-compose up -d backend
          sudo docker-compose up -d

          # ตั้ง Cron ต่ออายุใบรับรอง SSL อัตโนมัติทุกวันตี 3 (เพิ่มครั้งเดียว ถ้ามีอยู่แล้วจะไม่เพิ่มซ้ำ)
          APP_DIR=$(pwd)
          CRON_LINE="0 3 * * * /bin/bash $APP_DIR/scripts/renew-cert.sh >> /var/log/renew-cert.log 2>&1"
          if sudo crontab -l 2>/dev/null | grep -qF "scripts/renew-cert.sh"; then
            echo "✅ SSL renewal cron already installed"
          else
            (sudo crontab -l 2>/dev/null; echo "$CRON_LINE") | sudo crontab -
            echo "✅ SSL renewal cron installed"
          fi
          sudo crontab -l | grep -F "scripts/renew-cert.sh"

          # ซ้อมต่ออายุใบรับรองผ่าน nginx-proxy (ไม่ออกใบจริง) เพื่อยืนยันว่าการต่ออายุอัตโนมัติจะทำงานได้
          echo "=== SSL renewal dry-run ==="
          # --no-random-sleep-on-renew: certbot แบบ non-interactive จะสุ่มหน่วงเวลาได้ถึง ~8 นาที ทำให้ deploy เกิน timeout
          sudo certbot renew --dry-run --no-random-sleep-on-renew --webroot -w /var/www/certbot || echo "⚠️ WARNING: SSL renewal dry-run failed"

          # แสดง Log ล่าสุดของ Backend เพื่อตรวจสอบ OAuth Initialization
          echo "=== Backend Startup Logs (last 20 lines) ==="
          sleep 3
          sudo docker logs tumkrokzing_backend --tail 20
