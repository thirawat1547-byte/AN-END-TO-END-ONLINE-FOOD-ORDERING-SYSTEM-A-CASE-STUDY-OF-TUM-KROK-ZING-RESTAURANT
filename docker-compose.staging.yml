services:
  # 1. บริการส่วนของฐานข้อมูล MySQL สำหรับ Staging (แยก Port และ Volume ชัดเจน)
  mysql-db-staging:
    image: mysql:8.0
    container_name: tumkrokzing_db_staging
    hostname: mysql-server-staging
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tum_krok_zing_staging
    ports:
      - "3308:3306" # เปลี่ยน Port ฝั่ง Host เป็น 3308 เพื่อไม่ให้ชนกับ Production (3307)
    volumes:
      - mysql_data_staging:/var/lib/mysql

  # 2. บริการส่วนของ Backend (NestJS) สำหรับ Staging
  backend-staging:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: tumkrokzing_backend_staging
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3001:3000" # เปลี่ยน Port ฝั่ง Host เป็น 3001 เพื่อไม่ให้ชนกับ Production (3000)
    environment:
      # ให้ Backend Staging วิ่งไปหาฐานข้อมูล Staging
      DATABASE_URL: "mysql://root:rootpassword@mysql-db-staging:3306/tum_krok_zing_staging"
      PORT: 3000
    depends_on:
      - mysql-db-staging

  # 3. บริการส่วนของ Frontend (Vue.js) สำหรับ Staging
  frontend-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tumkrokzing_frontend_staging
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8081:80" # เปลี่ยน Port ฝั่ง Host เป็น 8081 เพื่อไม่ให้ชนกับ Production (8080)
    depends_on:
      - backend-staging

# ประกาศสร้าง Volume สำหรับเก็บข้อมูล MySQL แยกต่างหากสำหรับ Staging
volumes:
  mysql_data_staging:
